<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AFES · Adhésion 2027</title>
<!--
  Vidéos « Adhésion 2027 » de l'AFES, rendues image par image par render.js.
  Adresse : composition.html?v=generale  (version décrite dans versions.json,
  chronologie dans data/timeline_<version>.js) ; &t=12.5 affiche un instant ;
  &play=1 lit l'animation dans le navigateur (sans le son).
  Le format suit la taille de la fenêtre (1080×1350 pour LinkedIn) ; 1rem = 10 px à 1080 px.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600;700;900&family=Open+Sans:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
:root{
  --brun:#5F3114; --brun-m:#7F5A43; --ocre:#BF6525; --vert:#237D3D; --vert-c:#5EB26C;
  --beige:#EBE6E0; --peche:#F9BF92; --creme:#F7F2EB; --texte-clair:#FFF4E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--creme)}
body{font-family:'Open Sans',sans-serif;color:var(--brun);-webkit-font-smoothing:antialiased}
#frame{position:relative;width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(120% 70% at 85% 0%,#FFF9F1 0%,var(--creme) 55%,#F1E9DE 100%)}
.ocre{color:var(--ocre)} .vert{color:var(--vert)}

#hdr{position:absolute;left:6rem;right:6rem;top:5rem;height:10rem;display:flex;align-items:center;justify-content:space-between;z-index:5}
#hdrLogo{height:10.5rem;width:auto}
.pill{display:inline-block;font-family:'Livvic',sans-serif;font-weight:700;color:#fff;background:var(--ocre);border-radius:99rem;white-space:nowrap}
#hdrPill{font-size:3.4rem;padding:1.3rem 3rem 1.5rem}

#soil{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1}
#cap{position:absolute;left:5rem;right:5rem;z-index:4;text-align:center;font-family:'Livvic',sans-serif;font-weight:700;
  font-size:4.4rem;line-height:1.15;color:var(--texte-clair)}
#cap span{display:inline-block;margin:0 .3em 0 0}
#cap span.now{color:var(--peche)}

.scene{position:absolute;left:6rem;right:6rem;display:flex;flex-direction:column;justify-content:center;z-index:3;opacity:0}
.kicker{font-weight:800;font-size:3rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1.4rem}
h2{font-family:'Livvic',sans-serif;font-weight:900;color:var(--brun);line-height:1.04;letter-spacing:-.01em}
h2 .part{display:inline-block}
.ico{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--vert)}
.ico svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.el{will-change:transform,opacity}

/* lignes d'accroche */
.lines{align-items:flex-start}
.lines .ln{font-family:'Livvic',sans-serif;font-weight:900;line-height:1.02;letter-spacing:-.012em;color:var(--brun)}
.vag{display:block;margin-top:2.6rem;overflow:visible}

/* introduction : depuis 1934 */
.intro .row{display:flex;align-items:center;justify-content:space-between}
.intro .lbl{font-family:'Livvic',sans-serif;font-weight:700;font-size:5.4rem;color:var(--ocre);line-height:1}
.intro .year{font-family:'Livvic',sans-serif;font-weight:900;font-size:20rem;line-height:.9;color:var(--brun);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.photoCirc{width:27rem;height:27rem;border-radius:50%;overflow:hidden;border:1rem solid #fff;box-shadow:0 1.6rem 4rem rgba(95,49,20,.22);flex:none}
.photoCirc img,.photoRect img{width:100%;height:100%;object-fit:cover}
.intro .lead{font-size:4.3rem;font-weight:600;margin:3rem 0 2.2rem;line-height:1.25}
.intro .lead b{font-weight:800}
.chips{display:flex;flex-direction:column;gap:1.4rem}
.chip{display:flex;align-items:center;gap:2.4rem;background:#fff;border-radius:99rem;padding:1.2rem 4rem 1.2rem 1.2rem;align-self:flex-start;
  font-family:'Livvic',sans-serif;font-weight:700;font-size:5rem;color:var(--brun);box-shadow:0 .8rem 2.4rem rgba(95,49,20,.10)}
.chip .ico{width:8rem;height:8rem}

/* affirmation */
.statement .photoRect{width:100%;height:38rem;border-radius:3.2rem;overflow:hidden;box-shadow:0 1.6rem 4rem rgba(95,49,20,.18);margin-bottom:4rem}
.statement .bigIco{width:24rem;height:24rem;margin-bottom:4.4rem}
.statement .ln{font-family:'Livvic',sans-serif;font-weight:900;line-height:1.06;color:var(--brun)}
.statement .ln + .ln{margin-top:1.6rem}
.chipTxt{display:inline-block;font-family:'Open Sans',sans-serif;font-weight:700;color:#fff;background:var(--vert);border-radius:99rem;padding:1.2rem 3.4rem 1.4rem;margin-top:1rem}

/* cartes */
.cards h2{font-size:9rem;margin-bottom:3.6rem}
.cardList{display:flex;flex-direction:column;gap:2.2rem}
.card{display:flex;align-items:center;gap:3rem;background:#fff;border-radius:2.8rem;padding:2.6rem 3.2rem;border-left:1.1rem solid var(--vert);
  box-shadow:0 1rem 3rem rgba(95,49,20,.10)}
.card .ico{width:10rem;height:10rem}
.card .tx{min-width:0}
.card .tx b{display:block;font-family:'Livvic',sans-serif;font-weight:700;font-size:4.7rem;line-height:1.1;color:var(--brun)}
.card .tx span{display:block;font-weight:600;font-size:3rem;line-height:1.25;color:var(--brun-m);margin-top:.4rem}
.card img{margin-left:auto;height:8rem;width:auto;max-width:24rem;object-fit:contain;flex:none}

/* tuiles */
.tiles h2{font-size:8.6rem;margin-bottom:3rem}
.tileList{display:flex;flex-direction:column;gap:2.2rem}
.tile{display:flex;align-items:stretch;background:#fff;border-radius:2.8rem;overflow:hidden;box-shadow:0 1rem 3rem rgba(95,49,20,.10);border:.6rem solid transparent;height:19rem}
.tile .img{width:33rem;flex:none;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.tile .img img{width:100%;height:100%;object-fit:cover}
.tile .img.contain img{width:auto;height:auto;max-width:82%;max-height:80%;object-fit:contain}
.tile .tx{padding:2.4rem 3rem;display:flex;flex-direction:column;justify-content:center}
.tile .tx b{font-family:'Livvic',sans-serif;font-weight:700;font-size:4.6rem;line-height:1.08;color:var(--brun)}
.tile .tx span{font-weight:700;font-size:3rem;color:var(--ocre);margin-top:.8rem}

/* grand chiffre */
.big{align-items:center;text-align:center}
.timer{position:relative;width:46rem;height:46rem}
.timer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big .num{font-family:'Livvic',sans-serif;font-weight:900;line-height:.85;color:var(--brun);white-space:nowrap}
.big .unit{font-family:'Livvic',sans-serif;font-weight:700;font-size:5.6rem;color:var(--ocre);margin-top:1.2rem}
.big h2{font-size:7.6rem;margin-top:3.4rem}
.big .chip2{margin-top:2.8rem;font-size:3.6rem;font-weight:700;padding:1.6rem 3.6rem;background:var(--vert);color:#fff;border-radius:99rem}
.big .chip2 b{font-family:'Livvic',sans-serif;font-weight:900;font-size:4.6rem;margin-right:.4rem}

/* carton final */
.end{align-items:center;text-align:center}
.end .logo{height:19rem;width:auto}
.end .name{font-weight:700;font-size:3rem;color:var(--brun-m);margin-top:1.4rem}
.end .pill{font-size:5.4rem;padding:1.6rem 4.4rem 1.9rem;margin-top:3rem}
.end h2{font-size:8.8rem;margin-top:3.6rem;line-height:1.02}
.end .url{margin-top:3.6rem;font-weight:800;font-size:4.6rem;color:var(--vert)}
.end .url small{display:block;font-weight:600;font-size:3rem;color:var(--brun-m);margin-top:.6rem}
</style>
</head>
<body>
<div id="frame">
  <svg id="soil" xmlns="http://www.w3.org/2000/svg"></svg>
  <header id="hdr">
    <img id="hdrLogo" src="assets/logo-afes.svg" alt="AFES">
    <div id="hdrPill" class="pill">Adhésion 2027</div>
  </header>
  <div id="scenes"></div>
  <div id="cap"></div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const VERSION = Q.get('v') || 'generale';
(function(){
  const s = document.createElement('script');
  s.src = 'data/timeline_' + VERSION + '.js';
  s.onload = init;
  document.body.appendChild(s);
})();

// ---------- outils ----------
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,p)=>a+(b-a)*p;
const prog = (t,a,d)=>clamp((t-a)/d);
const eOut = p=>1-Math.pow(1-p,3);
const eInOut = p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack = p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const $ = id=>document.getElementById(id);
const h = (tag, cls, html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };
let W, H, R, TL, SC;

const ICONS = {
  loupe:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>',
  book:'<path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/>',
  map:'<path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18"/>',
  profil:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9.5c1.3-1.2 2.7-1.2 4 0s2.7 1.2 4 0 2.7-1.2 4 0 2.7 1.2 4 0M4 15c1.3-1.2 2.7-1.2 4 0s2.7 1.2 4 0 2.7-1.2 4 0 2.7 1.2 4 0"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>',
  mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  ticket:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="m9.5 14.5 5-5"/><circle cx="9.7" cy="9.7" r=".6"/><circle cx="14.3" cy="14.3" r=".6"/>',
  medal:'<circle cx="12" cy="9" r="5.5"/><path d="m9.2 13.8-1.6 7.2 4.4-2.4 4.4 2.4-1.6-7.2"/><path d="m9.8 9 1.6 1.6 3-3"/>',
  screen:'<rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/><path d="m10.5 8 4 2.2-4 2.2z"/>',
  network:'<circle cx="12" cy="5.5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.8 7.7 6.2 15.8M13.2 7.7l4.6 8.1M7.5 18h9"/>',
  pen:'<path d="M16.5 3.5l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.2 14.2c2.8 0 4.8 2.2 4.8 5.3"/>',
  building:'<path d="M4 21V5l8-2v18M12 8h8v13M2.5 21h19"/><path d="M7 8h2M7 12h2M7 16h2M15 12h2M15 16h2"/>',
  plane:'<path d="M21 3.5 3 10.5l7 2.5 2.5 7z"/><path d="m10 13 4.5-4.5"/>'
};
const icon = (name)=>`<svg viewBox="0 0 24 24">${ICONS[name]||''}</svg>`;

// La vaguelette de l'AFES : arcs reliés par des diagonales (motif du fichier vague-ocre.svg).
// Une période = 8,48 unités ; amplitude crête-creux = 2,32 unités.
const VAG_P = 8.48, VAG_C = 0.485;
function vagPath(x0, x1, yMid, s, shift){
  const P = VAG_P*s;
  let x = x0 - (((shift % P) + P) % P) - P;
  const y0 = yMid - VAG_C*s;
  let d = 'M' + x.toFixed(1) + ',' + y0.toFixed(1);
  const f = v=>(v*s).toFixed(2);
  while(x < x1 + P){
    d += ` c${f(.9)},${f(-.9)} ${f(2.37)},${f(-.9)} ${f(3.27)},0 l${f(.97)},${f(.97)} c${f(.9)},${f(.9)} ${f(2.37)},${f(.9)} ${f(3.27)},0 l${f(.97)},${f(-.97)}`;
    x += P;
  }
  return {d, xStart: x0 - (((shift % P) + P) % P) - P, xEnd:x};
}

// ---------- construction des scènes ----------
const els = [];   // {el, t, o} : éléments qui apparaissent à l'instant t
function reg(el, t, o={}){ el.classList.add('el'); els.push({el, t, o}); return el; }
function titleParts(arr){
  const h2 = h('h2');
  arr.forEach((p,i)=>{ if(i) h2.appendChild(document.createTextNode(' ')); h2.appendChild(reg(h('span','part',p.html), p.t-.05, {dy:36})); });
  return h2;
}

const BUILD = {
  lines(s, root){
    root.classList.add('lines');
    s.lines.forEach(l=>{ const e=h('div','ln',l.html); e.style.fontSize=l.size+'rem'; root.appendChild(reg(e, l.t-.05, {dy:44, s:.86, back:true, d:.42})); });
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','vag'); svg.setAttribute('width', 300*R); svg.setAttribute('height', 30*R);
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('fill','none'); p.setAttribute('stroke','#BF6525'); p.setAttribute('stroke-width', 5*R); p.setAttribute('stroke-linecap','round'); p.setAttribute('pathLength','1'); p.setAttribute('stroke-dasharray','1');
    const s4 = 4.2*R, P = VAG_P*s4;
    let d = `M${(.21*s4).toFixed(1)},${(15*R - VAG_C*s4).toFixed(1)}`;
    for(let i=0;i<7;i++){ const f=v=>(v*s4).toFixed(2); d += ` c${f(.9)},${f(-.9)} ${f(2.37)},${f(-.9)} ${f(3.27)},0 l${f(.97)},${f(.97)} c${f(.9)},${f(.9)} ${f(2.37)},${f(.9)} ${f(3.27)},0 l${f(.97)},${f(-.97)}`; }
    p.setAttribute('d', d);
    svg.setAttribute('width', 7*P + 10*R);
    svg.appendChild(p); root.appendChild(svg);
    s._vag = p; s._vagT = s.lines[s.lines.length-1].t + .2;
  },
  intro(s, root){
    root.classList.add('intro');
    const row = h('div','row'), left = h('div');
    left.appendChild(reg(h('div','lbl',s.label), s.t-.05));
    s._year = reg(h('div','year',String(s.year)), s.yearT-.08, {d:.35});
    left.appendChild(s._year); row.appendChild(left);
    const ph = h('div','photoCirc'); ph.innerHTML = `<img src="${s.photo}" alt="">`; s._photo = ph.querySelector('img');
    row.appendChild(reg(ph, s.t+.15, {dy:0, s:.6, back:true, d:.6}));
    root.appendChild(row);
    root.appendChild(reg(h('p','lead',s.lead.html), s.lead.t-.05, {dy:24}));
    const chips = h('div','chips');
    s.chips.forEach((c,i)=>{ const e=h('div','chip',`<span class="ico">${icon(c.icon)}</span>${c.text}`); e.style.marginLeft=(i*6)+'rem'; chips.appendChild(reg(e, c.t-.12, {dx:-60, dy:0, d:.42, back:true})); });
    root.appendChild(chips);
  },
  statement(s, root){
    root.classList.add('statement');
    if(s.photo){ const ph=h('div','photoRect'); ph.innerHTML=`<img src="${s.photo}" alt="">`; s._photo=ph.querySelector('img'); if(s.photoPos){ s._photo.style.objectPosition=s.photoPos; s._photo.style.transformOrigin=s.photoPos; } root.appendChild(reg(ph, s.t-.05, {dy:30, s:.94, d:.6})); }
    if(s.icon){ const ic=h('div','ico bigIco', icon(s.icon)); root.appendChild(reg(ic, s.t-.05, {dy:0, s:.5, back:true, d:.6})); }
    s.lines.forEach(l=>{ const e=h('div','ln',l.html); e.style.fontSize=l.size+'rem'; if(l.weight) e.style.fontWeight=l.weight; if(l.color) e.style.color=`var(--${l.color})`; root.appendChild(reg(e, l.t-.05, {dy:34})); });
  },
  cards(s, root){
    root.classList.add('cards');
    if(s.kicker){ const k=h('div','kicker',s.kicker.text); k.style.color=`var(--${s.kicker.color})`; root.appendChild(reg(k, s.t-.05, {dy:20})); }
    root.appendChild(titleParts(s.title));
    const list = h('div','cardList');
    s._items = s.items.map(it=>{
      const e = h('div','card', `<span class="ico">${icon(it.icon)}</span><div class="tx"><b>${it.title}</b>${it.sub?`<span>${it.sub}</span>`:''}</div>${it.logo?`<img src="${it.logo}" alt="">`:''}`);
      list.appendChild(reg(e, it.t-.15, {dx:80, dy:0, d:.45, back:true})); return e;
    });
    root.appendChild(list);
  },
  tiles(s, root){
    root.classList.add('tiles');
    if(s.kicker){ const k=h('div','kicker',s.kicker.text); k.style.color=`var(--${s.kicker.color})`; root.appendChild(reg(k, s.t-.05, {dy:20})); }
    root.appendChild(titleParts(s.title));
    const list = h('div','tileList');
    s._items = s.items.map(it=>{
      const e = h('div','tile', `<div class="img${it.contain?' contain':''}"><img src="${it.img}" alt=""></div><div class="tx"><b>${it.title}</b>${it.sub?`<span>${it.sub}</span>`:''}</div>`);
      list.appendChild(reg(e, it.t-.15, {dy:40, s:.9, d:.5, back:true})); return e;
    });
    root.appendChild(list);
  },
  big(s, root){
    root.classList.add('big');
    const box = h('div', s.ring ? 'timer' : '');
    const num = h('div','num',s.number); num.style.fontSize=(s.numberSize||24)+'rem';
    const unit = h('div','unit',s.unit);
    if(s.ring){
      box.innerHTML = `<svg viewBox="0 0 460 460"><circle cx="230" cy="230" r="206" fill="#fff" stroke="#EBE6E0" stroke-width="22"/>
        <circle class="ring" cx="230" cy="230" r="206" fill="none" stroke="#BF6525" stroke-width="22" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 230 230)"/>
        <circle class="dot" cx="230" cy="24" r="17" fill="#BF6525"/></svg>`;
      const t = h('div','t'); t.appendChild(num); t.appendChild(unit); box.appendChild(t);
      s._ring = box.querySelector('.ring'); s._dot = box.querySelector('.dot');
    } else { box.appendChild(num); box.appendChild(unit); }
    root.appendChild(reg(box, s.t-.1, {dy:0, s:.7, back:true, d:.5}));
    if(s.h) root.appendChild(reg(h('h2','',s.h.html), s.h.t, {dy:30}));
    if(s.chip) root.appendChild(reg(h('div','chip2',s.chip.html), s.chip.t-.1, {dy:20, s:.8, back:true}));
  },
  end(s, root){
    root.classList.add('end');
    root.appendChild(reg(Object.assign(h('img','logo'),{src:'assets/logo-afes.svg',alt:'AFES'}), s.t-.1, {dy:0, s:.5, back:true, d:.6}));
    root.appendChild(reg(h('div','name',"Association française pour l'étude du sol"), s.t+.2, {dy:16}));
    root.appendChild(reg(h('div','pill','Adhésion 2027'), s.t+.25, {dy:20, s:.7, back:true}));
    const h2 = h('h2');
    s.tagline.forEach((p,i)=>{ if(i) h2.appendChild(h('br')); h2.appendChild(reg(h('span','part',p.html), p.t-.08, {dy:36})); });
    root.appendChild(h2);
    root.appendChild(reg(h('div','url',`${s.url}<small>${s.urlSub}</small>`), TL.vo_end+.1, {dy:20}));
  }
};

// hauteur de la bande de sol (fraction de la hauteur d'image) selon le type de scène
const BAND = {lines:.36, end:.30, def:.20};
const bandOf = type => BAND[type] || BAND.def;

function sceneBounds(i){
  const s = SC[i], next = SC[i+1];
  return [i===0 ? -1 : s.start, next ? next.start : 1e9];
}
function bandFrac(t){
  let f = lerp(.24, bandOf(SC[0].type), eOut(prog(t, 0, .9)));
  for(let i=1;i<SC.length;i++) f = lerp(f, bandOf(SC[i].type), eInOut(prog(t, SC[i].start-.3, .7)));
  return f;
}

// ---------- sol : horizons séparés par la vaguelette ----------
const HZ = [   // [profondeur relative de la limite supérieure, couleur]
  [0,   '#90A050'],
  [.07, '#5F3114'],
  [.47, '#886850'],
  [.67, '#B89878'],
  [.85, '#D8C4AA'],
];
const VAG_S = 8.5;    // échelle de la vaguelette des horizons (période ≈ 72 px à 1080 px)
let hzPaths = [];
function buildSoil(){
  const svg = $('soil'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  hzPaths = HZ.map(([,c])=>{ const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('fill',c); svg.appendChild(p); return p; });
}
function drawSoil(t){
  const band = bandFrac(t)*H, top = H - band, s = VAG_S*R;
  const shift = t*14*R;   // lent glissement horizontal, identique pour tous les horizons
  HZ.forEach(([d],i)=>{
    const w = vagPath(0, W, top + d*band, s, shift);
    hzPaths[i].setAttribute('d', `${w.d} L${w.xEnd.toFixed(1)},${H+20} L${w.xStart.toFixed(1)},${H+20} Z`);
  });
  return {top, band};
}

// ---------- sous-titres ----------
let capIdx = -2;
function sceneAt(t){ return SC.findIndex((s,i)=>{ const [a,b]=sceneBounds(i); return t>=Math.max(a,0) && t<b; }); }
function drawCaptions(t, soil){
  const cap = $('cap');
  let idx = -1;
  TL.captions.forEach((c,i)=>{ if(t >= c.start-.1 && t < c.hold) idx = i; });
  const sc = sceneAt(t);
  const hidden = sc>=0 && SC[sc].captions === false;
  if(idx !== capIdx){ capIdx = idx; cap.innerHTML = idx<0 ? '' : TL.captions[idx].words.map(w=>`<span>${w.t}</span>`).join(''); }
  cap.style.top = (soil.top + soil.band*.27) + 'px';
  cap.style.transform = 'translateY(-50%)';
  if(idx<0 || hidden){ cap.style.opacity = 0; return; }
  const c = TL.captions[idx];
  const nxt = SC[sc+1], fadeOut = nxt && nxt.captions===false ? 1-prog(t, nxt.start-.2, .15) : 1;
  cap.style.opacity = eOut(prog(t, c.start-.1, .16)) * fadeOut;
  [...cap.children].forEach((sp,k)=>{
    const w = c.words[k];
    sp.style.opacity = t >= w.s-.04 ? 1 : .42;
    sp.classList.toggle('now', t >= w.s-.04 && t < w.e+.08);
  });
}

// ---------- rendu ----------
function pop(e, t){
  const o = e.o, d = o.d || .45, p = prog(t, e.t, d), k = o.back ? eBack(p) : eOut(p);
  const dx = (o.dx||0)*(1-k), dy = (o.dy===undefined?30:o.dy)*(1-k), sc = o.s!==undefined ? lerp(o.s,1,k) : 1;
  e.el.style.opacity = clamp(p*1.6);
  e.el.style.transform = `translate(${dx*R}px,${dy*R}px) scale(${sc})`;
}
function render(t){
  const soil = drawSoil(t);
  drawCaptions(t, soil);
  const endS = SC[SC.length-1];
  const hdrOut = eInOut(prog(t, endS.start-.25, .35));
  $('hdr').style.opacity = 1-hdrOut; $('hdr').style.transform = `translateY(${-hdrOut*30*R}px)`;

  SC.forEach((s,i)=>{
    const [a,b] = sceneBounds(i);
    const pin = a<0 ? 1 : eOut(prog(t, a-.12, .38)), pout = eInOut(prog(t, b-.3, .3));
    const al = pin*(1-pout);
    s._root.style.opacity = al;
    s._root.style.visibility = al>.001 ? 'visible' : 'hidden';
    s._root.style.transform = `translateY(${((1-pin)*50 - pout*40)*R}px)`;
    if(al<=.001) return;
    if(s._vag){ const p=eOut(prog(t, s._vagT, .6)); s._vag.setAttribute('stroke-dashoffset', 1-p); s._vag.style.visibility=p>.01?'visible':'hidden'; }
    if(s._year){ const yp=eOut(prog(t, s.yearT-.05, .9)); s._year.textContent=Math.round(lerp(1880, s.year, yp)); }
    if(s._photo) s._photo.style.transform = `scale(${lerp(1.16,1.02,prog(t,s.start,b-s.start))})`;
    if(s._ring){ const rp=eInOut(prog(t, s.start+.1, Math.max(1.2, Math.min(b,TL.duration)-s.start-.3))); s._ring.setAttribute('stroke-dashoffset',1-rp);
      const ang=rp*2*Math.PI-Math.PI/2; s._dot.setAttribute('cx',230+206*Math.cos(ang)); s._dot.setAttribute('cy',230+206*Math.sin(ang)); }
    if(s._items){ s._items.forEach((e,k)=>{ const at=s.items[k].t-.15, nx=s.items[k+1]?s.items[k+1].t-.15:b; const on=t>=at&&t<nx;
      if(s.type==='cards'){ e.style.borderLeftColor = on?'var(--ocre)':'var(--vert)'; e.style.boxShadow = on?'0 1.6rem 4rem rgba(95,49,20,.20)':'0 1rem 3rem rgba(95,49,20,.10)'; }
      else e.style.borderColor = on?'var(--ocre)':'transparent'; }); }
  });
  els.forEach(e=>pop(e,t));
}

// ---------- initialisation ----------
async function init(){
  TL = window.TIMELINE; SC = TL.scenes;
  W = innerWidth; H = innerHeight; R = Math.min(W,H)/1080;
  document.documentElement.style.fontSize = (10*R) + 'px';
  buildSoil();
  const host = $('scenes');
  SC.forEach(s=>{
    const root = h('section','scene'); s._root = root;
    root.style.top = ((s.type==='end' ? 6 : 18)*10*R) + 'px';
    root.style.bottom = (bandOf(s.type)*H + 30*R) + 'px';
    BUILD[s.type](s, root);
    host.appendChild(root);
  });
  await document.fonts.ready;
  await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
  window.render = render;
  render(parseFloat(Q.get('t')||'0'));
  window.READY = true;
  if(Q.get('play')){ const t0=performance.now(); const loop=()=>{ render(((performance.now()-t0)/1000)%TL.duration); requestAnimationFrame(loop); }; loop(); }
}
</script>
