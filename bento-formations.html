<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bento 4 · Se former · Maquettes site AFES</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BF6525}a:hover{color:#5F3114}
.root{font-family:'Open Sans',sans-serif;color:#000;background:#F7F7F7;font-size:16px;line-height:1.55}
.wrap{max-width:1170px;margin:0 auto;padding:0 15px;box-sizing:border-box}
.root h2,.root h3{font-family:Livvic,sans-serif;margin:0;line-height:1.15}
.root p{margin:0}
.mq{background:#F9BF92;color:#2F180A;font-size:13px;font-weight:600;text-align:center;padding:3px 12px}
.sub-title{font-family:Livvic,sans-serif;font-weight:800;font-size:22px;color:#237D3D;display:block}
.title{font-family:Livvic,sans-serif;font-weight:800;font-size:34px;color:#5F3114;text-transform:uppercase}
.vague{display:block;width:160px;height:10px;margin:16px 0 22px}
.btn-fill{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:5px;background:#BF6525;border:1px solid #BF6525;color:#fff;font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;text-decoration:none}
.btn-fill:hover{background:#5F3114;border-color:#5F3114;color:#fff}
.btn-white{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:5px;border:1px solid #fff;color:#fff;font-family:Livvic,sans-serif;font-weight:600;text-transform:uppercase;text-decoration:none}
.btn-white:hover{background:#fff;color:#5F3114}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:200px;gap:18px}
.b{position:relative;overflow:hidden;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-decoration:none;color:#fff;background:#5F3114;transition:transform .25s ease, box-shadow .25s ease}
.b:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(47,24,10,.18);color:#fff}
.b .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.b:hover .bg{transform:scale(1.05)}
.b .veil{position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,15,5,.85) 0%,rgba(30,15,5,.3) 60%,rgba(30,15,5,0) 100%)}
.b > *:not(.bg):not(.veil){position:relative}
.b h3{font-size:21px;font-weight:800;color:#fff}
.tag{display:inline-flex;align-self:flex-start;align-items:center;padding:2px 10px;border-radius:4px;background:#fff;color:#5F3114;font-size:12px;font-weight:700}
.date{display:inline-flex;flex-direction:column;align-items:center;background:#fff;color:#5F3114;border-radius:10px;padding:8px 14px;font-family:Livvic,sans-serif;line-height:1.05;align-self:flex-start}
.w2{grid-column:span 2}.h2{grid-row:span 2}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.bento{grid-template-columns:1fr;grid-auto-rows:auto}.w2,.h2{grid-column:auto;grid-row:auto}.b{min-height:190px}}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div id="dc-root"></div>

      <a href="#" class="b">

        <span class="veil"></span>
        <span class="tag">Animation</span>
        <h3>Animateur·rice pro de la Fresque du Sol</h3>
      </a>
      <a href="#" class="b">
        <img class="bg" src="assets/f-iprsols.png" alt="">

        <span class="tag">Forêt</span>

        <span class="tag" style="background:#5F3114;color:#fff">Bientôt</span>
        <div><h3 style="color:#5F3114">Sols de zones humides et SolRedOx</h3><p style="font-size:14px;margin-top:4px">Être prévenu·e de l'ouverture →</p></div>
      </a>
      <a href="#" class="b" style="background:#237D3D;justify-content:space-between">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0112 2.5a7 7 0 017 7C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        <div><h3>Formations initiales</h3><p style="font-size:14px;margin-top:4px">La carte des licences et masters en sciences du sol →</p></div>
      </a>
      <div class="b w2" style="background:#5F3114;flex-direction:row;flex-wrap:wrap;align-items:flex-end;align-content:flex-end;justify-content:space-between;gap:14px 20px">
        <div style="display:flex;flex-direction:column;gap:6px"><span class="tag" style="background:#F9BF92">Collectivités, entreprises, établissements</span><h3 style="font-size:22px">Une formation pour votre structure</h3><p style="font-size:14px;color:#EBE6E0">Fresque du Sol pour vos équipes, formation sur mesure sur vos sols.</p></div>
        <a href="#" class="btn-white" style="flex-shrink:0">Demander un devis</a>
      </div>
      <div class="b" style="background:#fff;color:#000;border:1px solid #ECECEC;justify-content:space-between">
        <span class="tag" style="background:#EBE6E0">Adhérent·es</span>
        <div><span style="font-family:Livvic,sans-serif;font-weight:800;font-size:40px;color:#BF6525;line-height:1">[‑ x %]</span><p style="font-size:14px;margin-top:4px">sur les formations de l'AFES <span style="color:#818284">[à confirmer]</span></p></div>
      </div>
      <a href="#" class="b" style="background:#EBE6E0;color:#5F3114;justify-content:space-between">
        <span style="font-family:Livvic,sans-serif;font-weight:800;font-size:46px;line-height:1">4</span>
        <div><h3 style="color:#5F3114">Tout le catalogue</h3><p style="font-size:14px;margin-top:4px">Formats, publics, sessions, tarifs →</p></div>
      </a>
    </div>
  </div>
</section>
</div>
</template>
