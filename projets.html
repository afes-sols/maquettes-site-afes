<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nos projets · Maquettes site AFES</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BF6525}a:hover{color:#5F3114}
.root{font-family:'Open Sans',sans-serif;color:#000;background:#fff;font-size:16px;line-height:1.65}
.wrap{max-width:1170px;margin:0 auto;padding:0 15px;box-sizing:border-box}
.root h1,.root h2,.root h3,.root h4{font-family:Livvic,sans-serif;margin:0;line-height:1.2}
.root p{margin:0}
.mq{background:#F9BF92;color:#2F180A;font-size:13px;font-weight:600;text-align:center;padding:3px 12px}
.topbar{background:#5F3114;color:#fff;font-size:14px}
.topbar a{color:#fff;text-decoration:none;font-family:Livvic,sans-serif;font-weight:600}
.top{font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;color:#000;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.top:hover,.top.on{color:#BF6525}
.icon-btn{width:44px;height:44px;border:1px solid #DDDDDD;border-radius:5px;background:#fff;color:#818284;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn-fill{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:5px;background:#BF6525;border:1px solid #BF6525;color:#fff;font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;text-decoration:none;box-sizing:border-box}
.btn-fill:hover{background:#5F3114;border-color:#5F3114;color:#fff}
.btn-cont{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:5px;border:1px solid #BF6525;color:#BF6525;background:transparent;font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;text-decoration:none;box-sizing:border-box}
.btn-cont:hover{background:#BF6525;color:#fff}
.btn-cont.small{min-height:34px;font-size:14px;padding:0 12px;text-transform:none}
.btn-white{border-color:#fff;color:#fff}.btn-white:hover{background:#fff;color:#5F3114}
.sub-title{font-family:Livvic,sans-serif;font-weight:800;font-size:22px;color:#237D3D;display:block}
.title{font-family:Livvic,sans-serif;font-weight:800;font-size:34px;color:#5F3114;margin:4px 0 14px}
.vague{display:block;width:160px;height:10px;margin-bottom:22px}
.banner{background:#3a2a1a url(assets/p-soilscape.jpg) center/cover}
.filt{font-family:Livvic,sans-serif;font-weight:600;font-size:15px;min-height:42px;padding:0 18px;border-radius:5px;border:1px solid #BF6525;background:#fff;color:#BF6525;cursor:pointer}
.filt:hover{background:#FCEBDD}
.filt.on{background:#BF6525;color:#fff}
.pcard{background:#fff;border:1px solid #ECECEC;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pcard h3{color:#5F3114;font-weight:800;font-size:21px}
.tag{display:inline-flex;align-items:center;padding:1px 10px;border-radius:4px;background:#EBE6E0;color:#5F3114;font-size:13px;font-weight:600}
.tag.m{background:#237D3D;color:#fff}
.esol{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:5px;background:#5F3114;color:#fff;font-family:Livvic,sans-serif;font-weight:600;font-size:14px;text-decoration:none}
.esol:hover{background:#2F180A;color:#fff}
.foot{background:#000 url(assets/bg-footer.jpg) center/cover;color:#BFC0C1}
.foot a{color:#BFC0C1;text-decoration:none}.foot a:hover{color:#fff}
.foot h3{color:#fff;font-size:20px;font-weight:700;margin-bottom:12px}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="root">
<div class="mq">Maquette de travail GT Com · Nouvelle page « Nos projets » (accessible depuis le menu « Projets ») · filtres cliquables</div>

<div class="topbar"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;flex-wrap:wrap">
  <span style="display:flex;align-items:center;gap:12px"><img src="assets/iuss-blanc.png" alt="IUSS" style="height:28px"> L'AFES est la branche française de l'Union Internationale de Science du Sol (IUSS, International Union of Soil Science)</span>
  <a href="#" style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M3 22c1-5 4.5-8 9-8s8 3 9 8z"></path></svg>CONNEXION</a>
</div></div>
<header style="background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:104px;flex-wrap:wrap">
    <a href="#" aria-label="AFES, accueil"><img src="assets/logo-afes.svg" alt="AFES" style="height:84px;display:block"></a>
    <nav aria-label="Menu principal" style="display:flex;gap:30px;flex-wrap:wrap;justify-content:center">
      <a href="#" class="top">L'AFES</a><a href="#" class="top">Les sols</a><a href="#" class="top">Nos missions</a><a href="#" class="top">Se former</a><a href="#" class="top on" aria-current="page">Projets</a><a href="#" class="top">Quoi de neuf ?</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="icon-btn" aria-label="Rechercher une ressource"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <a href="#" class="btn-fill">Adhérer</a>
    </div>
  </div>
</header>

<section class="banner" style="position:relative;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.4)"></div>
  <div style="position:relative;display:flex;flex-direction:column;gap:10px">
    <h1 style="color:#fff;font-size:60px;font-weight:800">Nos projets</h1>
    <p style="color:#fff;font-weight:700;font-size:15px">Accueil / Projets</p>
  </div>
</section>

<section style="padding:80px 0 40px">
  <div class="wrap">
    <span class="sub-title">Ce que l'AFES fait vivre</span>
    <h2 class="title">Tous nos projets, au même endroit</h2>
    <img class="vague" src="assets/vague-ocre.svg" alt="">
    <p style="max-width:820px;margin-bottom:26px">Aujourd'hui rangés dans les sous-menus des trois missions, les projets sont réunis ici. Chaque carte indique la mission à laquelle le projet se rattache et, quand elle existe, la communauté correspondante sur e-Sol.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap" role="group" aria-label="Filtrer par mission">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button class="filt {{f.cls}}" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>
</section>

<section style="padding:0 0 80px">
  <div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:26px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <article class="pcard">
        <img src="{{c.img}}" alt="" style="width:100%;aspect-ratio:5/3;object-fit:cover;display:block">
        <div style="padding:20px;display:flex;flex-direction:column;gap:10px;flex:1">
          <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag m">{{c.mission}}</span><span class="tag">{{c.type}}</span></div>
          <h3>{{c.title}}</h3>
          <p style="font-size:15px">{{c.text}}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px">
            <a href="#" class="btn-cont small">Voir le projet</a>
            <sc-if value="{{c.esol}}" hint-placeholder-val="{{ false }}"><a href="#" class="esol">Communauté e-Sol ↗</a></sc-if>
          </div>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section style="padding:0 0 70px">
  <div class="wrap"><div style="background:#5F3114;color:#fff;border-radius:10px;padding:36px 40px;display:flex;flex-wrap:wrap;gap:30px;align-items:center;justify-content:space-between">
    <div style="flex:1 1 560px">
      <span class="sub-title" style="color:#5EB26C">Le site présente, e-Sol fait vivre</span>
      <p style="font-size:17px;margin-top:8px">Le site de l'AFES décrit les projets (vitrine, durable). La plateforme e-Sol accueille les communautés qui les font vivre : discussions, partages, annonces. Chaque page projet renvoie vers sa communauté, et inversement.</p>
    </div>
    <a href="#" class="btn-cont btn-white">Découvrir e-Sol ↗</a>
  </div></div>
</section>

<section style="padding:0 0 90px">
  <div class="wrap"><div style="background:#F7F7F7;border-radius:10px;padding:46px">
    <span class="sub-title">Soutenir l'AFES !</span>
    <h2 class="title" style="text-transform:uppercase">Adhérer ou faire un don</h2>
    <img class="vague" src="assets/vague-ocre.svg" alt="">
    <div style="display:flex;gap:6px;flex-wrap:wrap"><a href="#" class="btn-fill">J'adhère</a><a href="#" class="btn-fill">Je fais un don</a></div>
  </div></div>
</section>

<footer class="foot">
  <div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;padding-top:60px;padding-bottom:40px">
    <div><img src="assets/logo-afes-blanc.png" alt="AFES" style="width:176px"></div>
    <div><h3>Menu</h3><ul><li><a href="#">L'AFES</a></li><li><a href="#">Les sols</a></li><li><a href="#">Nos missions</a></li><li><a href="#">Se former</a></li><li><a href="#">Projets</a></li><li><a href="#">Actualités</a></li></ul></div>
    <div><h3>Informations</h3><ul><li><a href="#">Contact</a></li><li><a href="#">Mentions légales</a></li><li><a href="#">Kit de communication</a></li></ul></div>
    <div><h3>Espace adhérents</h3><p style="margin-bottom:16px">Accéder à du contenu "Premium" pour les adhérents de l'AFES</p><a href="#" class="btn-cont" style="color:#BFC0C1">Connexion</a></div>
  </div>
  <div class="wrap" style="padding-bottom:24px;font-size:14px">© 2023 AFES - Tous droits réservés</div>
</footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":4100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 'all' }; }
  renderVals() {
    const P = [
      { m: 'animer', mission: 'Animer', type: 'Événement · 5 déc. 2026', img: 'assets/p-jms.png', title: 'Journée Mondiale des Sols 2026', text: 'Organisez ou rejoignez un événement près de chez vous.', esol: false },
      { m: 'animer', mission: 'Animer', type: 'Jeu sérieux', img: 'assets/p-fresque.jpg', title: 'La Fresque du Sol', text: '50 cartes et 3 h pour comprendre les sols, leurs fonctions et leurs menaces.', esol: true },
      { m: 'animer', mission: 'Animer', type: 'Projet européen', img: 'assets/p-soilscape.jpg', title: 'SOILSCAPE (Horizon Europe)', text: 'Le projet européen auquel participe l’AFES.', esol: false },
      { m: 'animer', mission: 'Animer', type: 'Festival', img: 'assets/p-festival.png', title: 'Festival européen Sols & Arts', text: 'Quand les artistes s’emparent des sols.', esol: true },
      { m: 'animer', mission: 'Animer', type: 'Congrès', img: 'assets/actu-jes.jpg', title: 'Journées d’Etude des Sols', text: 'Le rendez-vous de la communauté francophone des sciences du sol.', esol: false },
      { m: 'valoriser', mission: 'Valoriser', type: 'Plateforme', img: 'assets/hero-mobile.jpg', title: 'Réseau e-Sol', text: 'La plateforme d’échanges des acteurs et actrices des sols.', esol: true },
      { m: 'valoriser', mission: 'Valoriser', type: 'Revue', img: 'assets/p-egs.png', title: 'Étude et Gestion des Sols', text: 'La revue de l’AFES.', esol: false },
      { m: 'valoriser', mission: 'Valoriser', type: 'Ressources', img: 'assets/missions.jpg', title: 'Centre de ressources', text: 'Un centre de ressources pour mieux connaître les sols.', esol: false },
      { m: 'reconnaitre', mission: 'Reconnaître et fédérer', type: 'Formation', img: 'assets/f-promosols.png', title: 'PromoSolsTerrain', text: 'Se former à la description de sol sur le terrain.', esol: true },
      { m: 'reconnaitre', mission: 'Reconnaître et fédérer', type: 'Réseau', img: 'assets/f-iprsols.png', title: 'Référents qualité des sols forestiers', text: 'Un réseau national issu du projet IPRSol.', esol: true },
      { m: 'reconnaitre', mission: 'Reconnaître et fédérer', type: 'Soutien', img: 'assets/p-demolon.png', title: 'Bourses Demolon', text: 'Soutenir les jeunes chercheur·ses.', esol: false },
      { m: 'reconnaitre', mission: 'Reconnaître et fédérer', type: 'Participatif', img: 'assets/p-fresque2.jpg', title: 'Sciences et recherches participatives', text: 'Contribuer à la connaissance des sols.', esol: false }
    ];
    const defs = [['all', 'Tous les projets'], ['valoriser', 'Valoriser'], ['reconnaitre', 'Reconnaître et fédérer'], ['animer', 'Animer']];
    const cur = this.state.m;
    const filters = defs.map(([id, label]) => ({ label, cls: id === cur ? 'on' : '', pressed: id === cur ? 'true' : 'false', pick: () => this.setState({ m: id }) }));
    return { filters, cards: P.filter((p) => cur === 'all' || p.m === cur) };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
