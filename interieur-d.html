      <p style="margin-bottom:24px">La Fresque du Sol, au travers de 50 cartes et en 3h, permet de comprendre ce qu'est un sol, comment celui-ci se forme et quelles fonctions écologiques découlent de ses propriétés pour ensuite découvrir l'ensemble des services que l'on en retire, les menaces qui rendent ces services limités dans le temps et dans l'espace et les actions que l'on peut engager pour préserver le fonctionnement des sols.</p>
      <img src="assets/p-fresque.jpg" alt="Atelier Fresque du Sol" style="width:100%;border-radius:5px;display:block">
    </div>

    </div>
