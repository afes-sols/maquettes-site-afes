<section class="hero" style="position:relative;min-height:600px;display:flex;align-items:center">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.28)"></div>
  <div class="wrap" style="position:relative;width:100%;display:flex;flex-direction:column;gap:18px">
    <div style="display:inline-flex;align-items:center;gap:14px;background:#EBE6E0;border-radius:40px;padding:5px 22px 5px 5px;align-self:flex-start"><span style="background:#237D3D;color:#fff;border-radius:30px;padding:4px 18px;font-family:Livvic,sans-serif;font-weight:500">AFES</span><span style="color:#BF6525;font-family:Livvic,sans-serif;font-weight:500">Au service des sols depuis 1934</span></div>
    <h1 style="color:#fff;font-size:60px;font-weight:800;max-width:640px">AFES<br>Association Française pour l'Étude du Sol</h1>
    <p class="new" style="color:#fff;font-size:20px;max-width:640px">L'association qui rassemble toutes les personnes intéressées par l'étude des sols : chercheur·ses, enseignant·es, étudiant·es, agriculteur·rices et acteur·rices de la société civile.</p>
    <div class="new" style="display:flex;flex-direction:column;gap:10px;max-width:600px;margin-top:6px">

    </div>

  <span style="position:absolute;right:16px;bottom:12px;color:#fff;font-size:12px;opacity:.85">[Ici : la vidéo actuelle du bandeau]</span>
</section>

<section class="new" style="padding:80px 0;background:#F7F7F7;margin:16px 12px 0">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px">
      <a href="#" class="ocard" style="border-color:#BF6525;border-width:2px"><h3>Se former</h3><p>Décrire un sol sur le terrain, animer la Fresque du Sol, devenir référent·e des sols forestiers.</p><span class="btn-cont small" style="align-self:flex-start;margin-top:6px">Voir les formations</span></a>
      <a href="#" class="ocard"><h3>Découvrir nos projets</h3><p>Journée Mondiale des Sols, Festival européen Sols &amp; Arts, SOILSCAPE, Fresque du Sol…</p><span class="btn-cont small" style="align-self:flex-start;margin-top:6px">Voir les projets</span></a>
      <a href="#" class="ocard"><h3>Trouver une ressource</h3><p>Centre de ressources, revue Étude et Gestion des Sols, Référentiel pédologique.</p><span class="btn-cont small" style="align-self:flex-start;margin-top:6px">Explorer</span></a>
      <a href="#" class="ocard"><h3>Faire reconnaître ses compétences</h3><p>Reconnaissance des compétences en pédologie, réseaux de référent·es.</p><span class="btn-cont small" style="align-self:flex-start;margin-top:6px">En savoir plus</span></a>

    </div>
  </div>

<section style="padding:90px 0">
  <div class="wrap" style="display:flex;flex-wrap:wrap;gap:50px;align-items:center">
    <div style="flex:1 1 520px;aspect-ratio:16/9;background:#1b1b1b;border-radius:6px;position:relative;overflow:hidden">
      <img src="assets/missions.jpg" alt="" style="width:100%;height:100%;object-fit:cover;opacity:.55;display:block">
      <div style="position:absolute;left:0;right:0;top:0;padding:14px 18px;background:linear-gradient(#000a,#0000);display:flex;align-items:center;gap:12px;color:#fff;font-family:Arial,sans-serif"><img src="assets/logo-afes.svg" alt="" style="width:40px;height:40px;background:#fff;border-radius:50%;padding:4px;box-sizing:border-box"><strong style="font-size:18px">Présentation de l'Association Française pour l'Étude du Sol</strong></div>
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;background:#FF0000;border-radius:12px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4l14 8-14 8z"></path></svg></span>
    </div>
    <div style="flex:1 1 440px">
      <span class="sub-title">Qui sommes-nous ?</span>
      <h2 class="title">Association française pour l'étude du sol</h2>
      <img class="vague" src="assets/vague-ocre.svg" alt="">
      <p style="margin-bottom:18px">L'Association Française pour l'Étude du Sol (AFES) rassemble toutes les personnes intéressées par les différents aspects de l'étude des sols : chercheurs, enseignants, étudiants, techniciens, agriculteurs et tout acteur de la société civile qui par ses activités est en lien avec l'étude des sols.</p>
      <p style="margin-bottom:10px"><span style="color:#5EB26C">Ses activités</span> s'articulent selon trois axes :</p>
      <ul class="check" style="margin-bottom:26px">
        <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#fff" stroke="#ECECEC"></circle><path d="M8 13.5l3.2 3.2L18 10" fill="none" stroke="#5EB26C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Valoriser les ressources documentaires</li>
        <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#fff" stroke="#ECECEC"></circle><path d="M8 13.5l3.2 3.2L18 10" fill="none" stroke="#5EB26C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Reconnaître les compétences en sciences du sol</li>
        <li><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#fff" stroke="#ECECEC"></circle><path d="M8 13.5l3.2 3.2L18 10" fill="none" stroke="#5EB26C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Fédérer et animer les réseaux d'acteurs.</li>
      </ul>
      <a href="#" class="btn-cont">Découvrir l'AFES</a>
    </div>
  </div>
</section>

<section class="sols" style="position:relative;padding:90px 0">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.45)"></div>
  <div class="wrap" style="position:relative;color:#fff">
    <h2 style="font-size:40px;font-weight:700;color:#fff">LES SOLS</h2>
    <img class="vague" src="assets/vague-blanche.svg" alt="" style="margin-top:14px">
    <p style="font-size:26px;line-height:1.5;max-width:1000px;margin-bottom:50px">Les sols, issus de l'altération des roches sous l'effet du climat, du relief et des organismes vivants, forment l'épiderme de la Terre. Épais de quelques centimètres à plusieurs mètres, on doit les considérer comme une ressource non renouvelable à l'échelle humaine.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px;text-align:center;margin-bottom:46px">
      <div><h3 style="font-size:50px;font-weight:500;color:#fff">20 000</h3><h4 style="font-size:22px;font-weight:700;color:#fff;line-height:1.5">mégatonnes de carbone peuvent être séquestrées par les sols en 25 ans à l'échelle mondiale</h4></div>
      <div><h3 style="font-size:50px;font-weight:500;color:#fff">25 à 60%</h3><h4 style="font-size:22px;font-weight:700;color:#fff;line-height:1.5">de la biodiversité terrestre se trouve dans les sols</h4></div>
      <div><h3 style="font-size:50px;font-weight:500;color:#fff">95 %</h3><h4 style="font-size:22px;font-weight:700;color:#fff;line-height:1.5">de l'alimentation provient du sol</h4></div>
    </div>
    <div style="text-align:center"><a href="#" class="btn-cont btn-white">Découvrir les sols</a></div>
  </div>
</section>

<section style="padding:90px 0;background:#F7F7F7">

        <li class="mcard"><img src="assets/ico-hands.svg" alt="" style="width:50px;height:40px"><div style="display:flex;flex-direction:column;gap:4px"><h3>Reconnaitre et fédérer</h3><p>Reconnaître les compétences en sciences du sol</p><a href="#" class="btn-cont small" style="align-self:flex-start">Découvrir</a></div></li>
        <li class="mcard"><img src="assets/ico-magic.svg" alt="" style="width:45px;height:40px"><div style="display:flex;flex-direction:column;gap:4px"><h3>Animer</h3><p>Animer des échanges entre acteurs de la société civile et experts</p><a href="#" class="btn-cont small" style="align-self:flex-start">Découvrir</a></div></li>

  </div>

<section class="new" style="padding:80px 0;margin:16px 12px 0">

      <a href="#" class="ocard" style="padding:0;overflow:hidden"><img src="assets/f-solredox.png" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;opacity:.7"><div style="padding:18px;display:flex;flex-direction:column;gap:6px"><h3 style="font-size:19px">Sols de zones humides et application SolRedOx</h3><p style="font-size:14px">En construction · être prévenu·e</p></div></a>

<section style="padding:20px 0 90px">
  <div class="wrap"><div style="background:#F7F7F7;border-radius:10px;padding:50px;display:flex;flex-wrap:wrap;gap:40px;align-items:center">
    <div style="flex:1 1 440px">
