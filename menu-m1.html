<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Menu M1 · Deux rubriques en plus · Maquettes site AFES</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BF6525}a:hover{color:#5F3114}
.root{font-family:'Open Sans',sans-serif;color:#000;background:#fff;font-size:16px;line-height:1.6}
.root h1,.root h2,.root h3{font-family:Livvic,sans-serif;margin:0;line-height:1.15}
.root p{margin:0}
.mq{background:#F9BF92;color:#2F180A;font-size:13px;font-weight:600;text-align:center;padding:3px 12px}
.topbar{background:#5F3114;color:#fff;font-size:14px}
.topbar a{color:#fff;text-decoration:none;font-family:Livvic,sans-serif;font-weight:600}
.top{font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;color:#000;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.top:hover,.top.on{color:#BF6525}
.icon-btn{width:44px;height:44px;border:1px solid #DDDDDD;border-radius:5px;background:#fff;color:#818284;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn-fill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:5px;background:#BF6525;border:1px solid #BF6525;color:#fff;font-family:Livvic,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;text-decoration:none;box-sizing:border-box}
.btn-fill:hover{background:#5F3114;border-color:#5F3114;color:#fff}
.dd{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);border-top:3px solid #BF6525;padding:10px 0}
.dd a{display:block;padding:7px 22px;font-family:Livvic,sans-serif;font-weight:500;font-size:16px;color:#000;text-decoration:none;white-space:nowrap}
.dd a:hover{color:#BF6525}
.dd .grp{font-family:Livvic,sans-serif;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#237D3D;padding:8px 22px 2px}
.hero{background:#3a2a1a url(assets/bg-header.jpg) center/cover}
.newlabel{display:none}
.show-new .new{outline:2px dashed #5EB26C;outline-offset:4px;border-radius:6px}
.show-new .newlabel{display:inline-flex;align-items:center;background:#237D3D;color:#fff;font-family:Livvic,sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:999px;line-height:1.6}
.note{position:absolute;background:#FFF6D6;border:1px solid #E5C66A;color:#3E2716;font-size:14px;line-height:1.45;padding:10px 14px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="{{rootClass}}" style="width:1280px;height:640px;overflow:hidden;position:relative">
<div class="mq">Maquette de travail GT Com · Menu, piste M1 : deux rubriques en plus</div>
<div class="topbar"><div style="max-width:1170px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 15px">
  <span style="display:flex;align-items:center;gap:12px"><img src="assets/iuss-blanc.png" alt="IUSS" style="height:28px"> L'AFES est la branche française de l'Union Internationale de Science du Sol (IUSS, International Union of Soil Science)</span>
  <a href="#" style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M3 22c1-5 4.5-8 9-8s8 3 9 8z"></path></svg>CONNEXION</a>
</div></div>
<header style="background:#fff;position:relative;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.06)">
  <div style="max-width:1170px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:104px;padding:0 15px">
    <a href="#" aria-label="AFES, accueil"><img src="assets/logo-afes.svg" alt="AFES" style="height:84px;display:block"></a>
    <nav aria-label="Menu principal" style="display:flex;gap:30px;align-items:center">
      <a href="#" class="top">L'AFES</a><a href="#" class="top">Les sols</a><a href="#" class="top">Nos missions</a>
      <a href="#" class="top new {{clsFormer}}" aria-expanded="{{isFormer}}">Se former</a>
      <a href="#" class="top new {{clsProjets}}" aria-expanded="{{isProjets}}">Projets</a>
      <a href="#" class="top">Quoi de neuf ?</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="icon-btn new" aria-label="Rechercher une ressource"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <a href="#" class="btn-fill">Adhérer</a>
    </div>
  </div>
  <sc-if value="{{isProjets}}" hint-placeholder-val="{{ true }}">
  <div class="dd new" style="position:absolute;left:640px;top:104px;width:330px">
    <span class="grp">Temps forts</span>
    <a href="#">Journée Mondiale des Sols 2026</a><a href="#">Journées d'Étude des Sols</a><a href="#">Festival européen Sols &amp; Arts</a>
    <span class="grp">Projets et dispositifs</span>
    <a href="#">SOILSCAPE (Horizon Europe)</a><a href="#">La Fresque du Sol</a><a href="#">Réseau e-Sol</a><a href="#">PromoSolsTerrain</a><a href="#">Bourses Demolon</a>
    <a href="#" style="color:#BF6525;font-weight:600">Tous les projets →</a>
  </div>
  </sc-if>
  <sc-if value="{{isFormer}}" hint-placeholder-val="{{ false }}">
  <div class="dd new" style="position:absolute;left:520px;top:104px;width:360px">
    <a href="#" style="color:#BF6525;font-weight:600">Toutes les formations →</a>
    <span class="grp">Formations continues</span>
    <a href="#">Décrire un sol sur le terrain (PromoSolsTerrain)</a><a href="#">Animateur·rice pro de la Fresque du Sol</a><a href="#">Référent·e qualité des sols forestiers</a><a href="#">Zones humides et SolRedOx (bientôt)</a>
    <span class="grp">Pour les structures</span>
    <a href="#">Formation sur mesure · demander un devis</a>
    <span class="grp">Formations initiales</span>
    <a href="#">Carte des licences et masters</a>
  </div>
  </sc-if>
</header>
<div class="hero" style="height:470px;position:relative">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.25)"></div>
  <div style="position:absolute;left:70px;top:190px;display:flex;flex-direction:column;gap:14px;max-width:520px">
    <div style="display:inline-flex;align-items:center;gap:14px;background:#EBE6E0;border-radius:40px;padding:5px 22px 5px 5px;align-self:flex-start"><span style="background:#237D3D;color:#fff;border-radius:30px;padding:4px 18px;font-family:Livvic,sans-serif;font-weight:500">AFES</span><span style="color:#BF6525;font-family:Livvic,sans-serif;font-weight:500">Au service des sols depuis 1934</span></div>
    <h1 style="color:#fff;font-size:52px;font-weight:800">AFES<br>Association Française pour l'Étude du Sol</h1>
  </div>
  <p class="note" style="left:1000px;top:120px;width:240px">Même en-tête, même style. On ajoute <strong>Se former</strong> et <strong>Projets</strong> au premier niveau ; la recherche passe en icône pour faire de la place. Les pages existantes ne bougent pas : seuls les liens du menu changent (réglage WordPress).</p>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"showNew":{"editor":"boolean","default":true,"section":"Maquette"},"ouvert":{"editor":"enum","options":["projets","former"],"default":"projets","section":"Maquette"},"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const show = this.props.showNew ?? true;
    const o = this.props.ouvert ?? 'projets';
    return {
      rootClass: show ? 'root show-new' : 'root',
      isProjets: o === 'projets', isFormer: o === 'former',
      clsProjets: o === 'projets' ? 'on' : '', clsFormer: o === 'former' ? 'on' : ''
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
