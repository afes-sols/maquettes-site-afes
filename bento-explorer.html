<!doctype html>

<head>
<meta charset="utf-8">

<title>Bento 3 · Explorer · Maquettes site AFES</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BF6525}a:hover{color:#5F3114}
.root{font-family:'Open Sans',sans-serif;color:#000;background:#fff;font-size:16px;line-height:1.55}
.wrap{max-width:1170px;margin:0 auto;padding:0 15px;box-sizing:border-box}
.root h2,.root h3{font-family:Livvic,sans-serif;margin:0;line-height:1.15}
.root p{margin:0}
.mq{background:#F9BF92;color:#2F180A;font-size:13px;font-weight:600;text-align:center;padding:3px 12px}
.sub-title{font-family:Livvic,sans-serif;font-weight:800;font-size:22px;color:#237D3D;display:block}
.title{font-family:Livvic,sans-serif;font-weight:800;font-size:34px;color:#5F3114;text-transform:uppercase}
.vague{display:block;width:160px;height:10px;margin:16px 0 22px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:200px;gap:18px}
.b{position:relative;overflow:hidden;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-decoration:none;color:#000;transition:transform .25s ease, box-shadow .25s ease}
.b:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(47,24,10,.16)}
.b h3{font-size:21px;font-weight:800;color:#5F3114}
.b p{font-size:14px}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:700}
.tag.int{background:#E3F1E6;color:#1E6B34}
.tag.ext{background:#FCDFC8;color:#5F3114}
.tag.esol{background:#fff;color:#5F3114}
.ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.w2{grid-column:span 2}.h2{grid-row:span 2}
.field{display:flex;background:#fff;border-radius:6px;overflow:hidden;border:1px solid #DDDDDD}
.field input{flex:1;border:0;padding:0 14px;min-height:46px;font:inherit;min-width:0}
.field button{border:0;background:#BF6525;color:#fff;padding:0 16px;font-family:Livvic,sans-serif;font-weight:700;cursor:pointer}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.bento{grid-template-columns:1fr;grid-auto-rows:auto}.w2,.h2{grid-column:auto;grid-row:auto}.b{min-height:170px}}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
