      <li>Le bloc « Vous n'avez pas encore de compte ? » s'affiche même une fois connecté·e ; il promet des « notes de lecture » introuvables.</li>
      <li>Seuls 4 articles réservés sont visibles. Les avantages listés sur la page « Adhérer » (Lettre de l'Association, tarifs préférentiels, replays des Rendez-vous, CR du CA, AG) ne sont pas regroupés.</li>
