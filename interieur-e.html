      <h2 class="title">C'est quoi la Fresque du Sol ?</h2>
      <img class="vague" src="assets/vague-ocre.svg" alt="">
      <p style="margin-bottom:24px">La Fresque du Sol, au travers de 50 cartes et en 3h, permet de comprendre ce qu'est un sol, comment celui-ci se forme et quelles fonctions écologiques découlent de ses propriétés pour ensuite découvrir l'ensemble des services que l'on en retire, les menaces qui rendent ces services limités dans le temps et dans l'espace et les actions que l'on peut engager pour préserver le fonctionnement des sols.</p>
      <img src="assets/p-fresque.jpg" alt="Atelier Fresque du Sol" style="width:100%;border-radius:5px;display:block">
    </div>
    <div id="e2">
      <span class="sub-title">Concrètement comment ça se passe ?</span>
      <h2 class="title">Le déroulement d'un atelier</h2>
      <img class="vague" src="assets/vague-ocre.svg" alt="">
      <p>Le jeu de la Fresque du Sol se déroule en 5 parties qui permettent d'explorer les différentes facettes des sols, des enjeux de leur préservation et des actions que l'on peut envisager pour mieux préserver les sols. En 3h, 8 joueur·ses vont être amené·es à disposer 50 cartes sur une feuille de papier afin de construire leur représentation des sols et des problématiques qui leurs sont liées.</p>
    </div>
    <div id="e3">

    </div>
